name: Native CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Native tests with race detection
        run: go test -race -count=1 -timeout=10m ./...
      - name: Build and verify CLI metadata
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/downfile.exe"
          go build -trimpath -ldflags "-X main.AppVersion=ci-smoke -X main.BuildDate=2000-01-01" -o "$binary" ./cmd/downfile
          output=$("$binary" -v)
          printf '%s\n' "$output"
          grep -Fxq 'downfile version ci-smoke' <<< "$output"
          grep -Fxq 'Build Date: 2000-01-01' <<< "$output"
