name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (for example 0.1.0)'
        required: true
        type: string
      publish:
        description: 'Publish a GitHub Release after all checks pass'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      date: ${{ steps.metadata.outputs.date }}
    steps:
      - name: Validate release metadata
        id: metadata
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Invalid version; expected a numeric version with an optional prerelease suffix.' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

  native-tests:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    needs: [prepare, native-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            artifact: downfile-windows-amd64.exe
          - goos: windows
            goarch: arm64
            artifact: downfile-windows-arm64.exe
          - goos: linux
            goarch: amd64
            artifact: downfile-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: downfile-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact: downfile-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: downfile-darwin-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_DATE: ${{ needs.prepare.outputs.date }}
          ARTIFACT: ${{ matrix.artifact }}
        run: go build -trimpath -ldflags "-s -w -X main.AppVersion=$VERSION -X main.BuildDate=$BUILD_DATE" -o "$ARTIFACT" ./cmd/downfile
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: downfile v${{ needs.prepare.outputs.version }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
